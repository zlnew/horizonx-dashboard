# Dev compose for the HorizonX Dashboard (Vue 3 + Vite).
# No custom Dockerfile in this repo — runs the Vite dev server from source.
services:
  dashboard:
    image: node:22-alpine
    container_name: horizonx-dashboard
    working_dir: /app
    command: ['sh', '-c', 'npm install && npm run dev -- --host 0.0.0.0 --port 5173']
    env_file:
      - path: .env
        required: false
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3002}
    volumes:
      - .:/app
      - dashboard-node-modules:/app/node_modules
    ports:
      - '127.0.0.1:${DASHBOARD_PORT:-3003}:5173'
    restart: unless-stopped
    networks:
      - personal-network

volumes:
  dashboard-node-modules:

networks:
  personal-network:
    external: true
