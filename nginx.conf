# HorizonX Dashboard — production nginx.
# Serves the built SPA and proxies /api/* (including the WebSocket endpoint)
# to the control-plane server container. The server must be reachable at
# `server:3000` (compose network) — override with $HORIZONX_SERVER upstream if needed.

upstream horizonx_server {
    server server:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — serve index.html for client routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + WebSocket proxy (strips the /api prefix, mirrors the Vite dev proxy).
    location /api/ {
        proxy_pass http://horizonx_server/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
