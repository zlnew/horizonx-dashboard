# HorizonX Dashboard — production nginx.
# Serves the built SPA and proxies /api/* (including the WebSocket endpoint)
# to the control-plane server container.
#
# The upstream is resolved at REQUEST time (variable + resolver) rather than
# config-load time, so boot order between the dashboard and server containers
# doesn't matter — the server just needs to be reachable at `server:3000` on
# the compose network. Docker's embedded DNS (127.0.0.11) handles lookups.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — serve index.html for client routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + WebSocket proxy. NOTE: with `proxy_pass http://$upstream/;` (a
    # variable + trailing slash), nginx forwards the URI from proxy_pass — a
    # literal `/` — instead of the original request path, so /api/health would
    # reach the server as `/` (Go 404). The rewrite strips the /api prefix
    # into $1 and the variable proxy_pass (no URI part) preserves it.
    location /api/ {
        set $upstream "server:3000";
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
