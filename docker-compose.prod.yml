# Production compose for the HorizonX Dashboard — used by the HorizonX agent.
# Builds the SPA image from this repo's Dockerfile (node build → nginx), so it
# works without GHCR (billing-blocked). nginx proxies /api + WebSocket to the
# control-plane server at `server:3000` on the same compose network — deploy
# alongside the horizonx prod compose or point it at the shared control plane.
#
# Env overrides (written to .env by HorizonX):
#   DASHBOARD_PORT (default 3003, host)
services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-horizonx-dashboard:latest}
    container_name: ${APP_CONTAINER_NAME:-horizonx-dashboard}
    ports:
      - '127.0.0.1:${DASHBOARD_PORT:-3003}:80'
    restart: unless-stopped
    networks:
      - personal-network

networks:
  personal-network:
    external: true
